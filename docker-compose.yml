services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bulk
      POSTGRES_PASSWORD: bulk
      POSTGRES_DB: bulk_analyzer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bulk -d bulk_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://bulk:bulk@postgres:5432/bulk_analyzer
    command: ["yarn", "workspace", "@bulk/db", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://bulk:bulk@postgres:5432/bulk_analyzer
      REDIS_URL: redis://redis:6379
      PORT: 4000
      # AUTH_TOKEN: your-secret-token  # Uncomment to enable auth
      DOMAIN_RATE_LIMIT: "2"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://bulk:bulk@postgres:5432/bulk_analyzer
      REDIS_URL: redis://redis:6379
      AUDIT_CONCURRENCY: "5"
      DOMAIN_RATE_LIMIT: "2"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    shm_size: 1gb

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
